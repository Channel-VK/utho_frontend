server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for fast asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Docker embedded DNS resolver so Nginx starts cleanly even if backend container restarts
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Reverse-proxy all /api/v1/* calls (including /api/v1/ai/*) to the Go Backend Gateway
    location /api/ {
        set $backend_upstream http://utho-backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Reverse-proxy Go Backend health check
    location = /healthz {
        set $backend_upstream http://utho-backend:8080;
        proxy_pass $backend_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache immutable Vite hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
